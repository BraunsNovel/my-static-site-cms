[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA için tüm istekleri index.html'e yönlendir (hash router zaten çalışır ama fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify Identity (Decap CMS için)
[identity]
  enabled = true

[identity.config]
  registration = "invite"

# Güvenlik başlıkları
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
